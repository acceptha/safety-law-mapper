name: 🐛 버그 신고
description: CLI/라이브러리의 동작 오류를 신고합니다
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 있었나요
      description: 실행한 명령과 실제 결과, 기대한 결과를 적어주세요.
      placeholder: |
        실행: slm search 밀폐공간
        실제: ...
        기대: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 버전
      placeholder: slm version 출력 / Python 버전 / OS
    validations:
      required: true
