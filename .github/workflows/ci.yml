name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install server extras (optional)
        # The MCP and API servers are optional; their tests skip when absent.
        # A transitive wheel that lags a new Python release must not fail the
        # core matrix.
        continue-on-error: true
        run: pip install -e ".[mcp,api]"
      - name: Validate data
        run: slm validate
      - name: Run tests
        run: pytest -q

  docker:
    # The API ships as an image; a Dockerfile nobody builds is a Dockerfile
    # that is already broken. The build runs `slm validate` inside itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t safety-law-mapper:ci .
      - name: Boot it and check the API answers
        run: |
          docker run -d --name slm -p 8000:8000 safety-law-mapper:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/search?q=%EC%A7%80%EA%B2%8C%EC%B0%A8" \
            | grep -q forklift-operation
          docker rm -f slm
