name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install MCP extra (optional)
        # The MCP server is optional; its tests skip when absent. A transitive
        # wheel that lags a new Python release must not fail the core matrix.
        continue-on-error: true
        run: pip install -e ".[mcp]"
      - name: Validate data
        run: slm validate
      - name: Run tests
        run: pytest -q
