name: 사고속보 수집

on:
  schedule:
    # 22:00 UTC = 07:00 KST. 게시가 부정기(사고일 기준 3~8일 지연)라
    # 하루 1회 이상 돌릴 실익이 없다 — 기획서 §3.4.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "조회할 최대 목록 페이지 수 (백필 시 상향)"
        required: false
        default: "25"

concurrency:
  group: incidents
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      # 수집이 실패하면 여기서 워크플로가 멈춘다. 비공식 API라 언제든
      # 바뀔 수 있고, 조용히 0건을 저장하는 것이 실패보다 나쁘다.
      - name: Collect incidents
        run: python scripts/fetch_kosha_incidents.py --pages "${{ inputs.pages || '25' }}"

      # 수집한 데이터가 아니라 매핑 데이터의 무결성을 지키는 게이트.
      # 사고 수집이 법령 데이터를 깨뜨릴 일은 없지만, 깨진 상태로 커밋이
      # 쌓이는 것을 막는다.
      - name: Validate data
        run: slm validate

      - name: Run tests
        run: pytest -q

      - name: Build coverage report
        run: python scripts/build_coverage_report.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "acceptha"
          git config user.email "acceptha@gmail.com"
          # 먼저 스테이징한다. 리포트가 처음 생성되면 untracked 라서
          # `git diff` 로는 변경이 보이지 않는다.
          git add -A -- data/incidents docs/incidents
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋하지 않습니다."
            exit 0
          fi
          total=$(wc -l < data/incidents/kosha-alerts.jsonl)
          git commit -m "data: 사고속보 수집 (총 ${total}건)" -m "scripts/fetch_kosha_incidents.py + build_coverage_report.py 자동 실행." -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          # 사이에 다른 커밋이 들어왔을 수 있다. 수집 결과는 append-only 라
          # 리베이스로 안전하게 얹힌다.
          # push 대상을 명시한다. 맨 `git push` 는 upstream 설정에 의존해서
          # detached HEAD 나 브랜치명이 다른 체크아웃에서 조용히 실패한다.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push 실패 ($attempt/3) - 리베이스 후 재시도"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::3회 재시도 후에도 push 하지 못했습니다"
          exit 1

      # 알림은 두 갈래다. 신호의 빈도가 16배 차이 나서 하나로 묶을 수 없다.
      #
      #   공백  주 0.32회 · 100% 가 손이 필요한 것  → 생기는 날 바로, 작업 이슈로
      #   요약  주 5.9건 들어옴 · 대부분 이미 매핑됨 → 8건 또는 7일 중 먼저, 댓글로
      #
      # 수집될 때마다 알리면 주 1.96회 울리는데 그중 16%만 손댈 것이 있다.
      # 두 주면 아무도 보지 않게 되고, 정작 필요한 날의 알림까지 같이 묻힌다.
      # 상수의 근거는 scripts/simulate_alert_policies.py 의 소급 측정이다.
      #
      # 커밋 뒤에 둔다. 여기서 실패해도 수집한 데이터는 이미 안전하고, 실패가
      # 보이는 편이 알림이 조용히 끊긴 채로 도는 것보다 낫다.
      - name: Notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 라벨이 없으면 --label 이 실패한다. 있으면 그대로 둔다.
          gh label create data-gap --color B60205 --description "미매핑 사고 - 매핑 기여 대상" 2>/dev/null || true
          gh label create digest --color 0E8A16 --description "수집 요약" 2>/dev/null || true

          gaps=$(python scripts/report_new_gaps.py)
          if [ -n "$gaps" ]; then
            gh issue create --label data-gap               --title "데이터 공백: $(TZ=Asia/Seoul date +%F) 수집분" --body "$gaps"
          else
            echo "새로 생긴 데이터 공백 없음 - 이슈를 만들지 않습니다."
          fi

          # 요약은 이슈 하나에 댓글로 쌓는다. 이슈가 늘지 않고, 마지막 댓글
          # 시각이 그대로 '마지막 발송일'이 된다 - 상태 파일도, 커밋도 없다.
          num=$(gh issue list --label digest --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            url=$(gh issue create --label digest --title "사고속보 수집 요약"               --body "@acceptha 수집 요약이 이 이슈에 댓글로 쌓입니다. 보내는 기준은 **8건 또는 7일 중 먼저**이고, 근거는 \`scripts/simulate_alert_policies.py\` 입니다.")
            echo "요약 이슈를 만들었습니다: $url"
            # 방금 만들었으면 기준일이 오늘이라 보낼 것이 없다.
            exit 0
          fi
          # --paginate 로 전부 받아 마지막을 쓴다. 매주 한 건씩 쌓이는 이슈라
          # 한 페이지만 보면 몇 년 뒤 조용히 틀린 기준일을 집는다.
          since=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/$num/comments" --jq '.[].created_at' | tail -1)
          if [ -z "$since" ]; then
            since=$(gh issue view "$num" --json createdAt --jq '.createdAt')
          fi
          since="${since%%T*}"
          body=$(python scripts/report_new_incidents.py --since "$since")
          if [ -n "$body" ]; then
            gh issue comment "$num" --body "$body"
          else
            echo "요약을 보낼 때가 아닙니다 (기준일 $since)."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### 사고속보 수집 결과"
            echo
            if [ -f data/incidents/kosha-alerts.jsonl ]; then
              echo "- 총 $(wc -l < data/incidents/kosha-alerts.jsonl)건"
            fi
            echo "- 리포트: \`docs/incidents/coverage.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
