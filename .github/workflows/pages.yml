name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and validate
        run: |
          pip install -e .
          slm validate
      - name: Build site
        run: |
          mkdir -p _site
          # Copy the whole directory: index.html imports matcher.js, and
          # naming files one by one is how the next asset gets forgotten.
          cp web/*.html web/*.js _site/
          python scripts/export_web_data.py _site/data.json
      - name: Check the demo has everything it needs
        run: |
          for f in index.html matcher.js data.json; do
            test -s "_site/$f" || { echo "missing _site/$f"; exit 1; }
          done
          # Every module index.html imports must have been copied.
          sed -n 's|.*from "\./\([^"]*\)".*|\1|p' _site/index.html | while read -r m; do
            test -s "_site/$m" || { echo "index.html imports $m but it was not deployed"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
