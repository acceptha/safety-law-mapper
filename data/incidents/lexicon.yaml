# 사고속보 원문 표현 → 매핑 키워드 사전 (사람이 관리, 자동 학습 없음)
#
# 목적: KOSHA 사고속보의 실제 표현을 data/mappings/*.yaml 의 work_type.keywords
#       어휘로 옮긴다. 여기 없는 표현은 매핑 키워드와 직접 일치할 때만 신호가 된다.
#
# 기여 방법: surface 에 원문 표현을, keywords 에 기존 매핑 키워드를 적는다.
#            법령 조문 검증이 필요 없으므로 첫 기여로 적합하다.
#            새 작업 유형 자체가 없다면 이 파일이 아니라 매핑 YAML을 만들어야 한다.

terms:
  # --- 띄어쓰기·표기 변형 -------------------------------------------------
  - surface: [연삭 숫돌, 연삭숫돌, 숫돌]
    keywords: [연삭기]
    note: 사고속보는 "깨진 연삭 숫돌"처럼 띄어 쓰는 경우가 많음

  - surface: [굴삭기]
    keywords: [굴착기]
    note: 법령 용어는 굴착기, 현장 표현은 굴삭기

  # 이동식비계는 제68조(바퀴 고정·아웃트리거·최대적재하중 250kg)가 따로 있다.
  # '비계'만 주면 비계 조립작업(제56~58조)으로 간다. 합성어 억제가 함께
  # 있어야 정확 일치 2점을 뺏기지 않는다.
  - surface: [이동식 비계, 이동식비계]
    keywords: [이동식비계]
    suppress: [비계]
    category: work-at-height

  - surface: [강관 비계, 강관비계]
    keywords: [강관비계]

  - surface: [이동식 사다리, 이동식사다리]
    keywords: [사다리]

  - surface: [차량탑재형 고소작업대, 고소작업차, 스카이차]
    keywords: [고소작업대]

  - surface: [천장크레인, 천장 크레인, 이동식 크레인]
    keywords: [크레인]

  - surface: [권상기, 권양기]
    keywords: [호이스트]

  - surface: [화물용 승강기, 화물용승강기, 승강기]
    keywords: [리프트]

  # --- 밀폐공간 (기준규칙 별표18 제11호 명시 장소) ------------------------
  - surface: [정화조, 침전조, 집수조, 오수조, 분뇨]
    keywords: [밀폐공간]
    category: confined-space
    note: 별표18 제11호 — 분뇨·오수 등이 들어있는 정화조·침전조·집수조

  # --- 지붕 (roof-work) ---------------------------------------------------
  - surface: [지붕, 지붕재, 지붕해체, 스카이라이트, 선라이트]
    keywords: [지붕]
    category: work-at-height

  - surface: [채광창]
    keywords: [채광창]
    category: work-at-height

  - surface: [슬레이트]
    keywords: [슬레이트]
    category: work-at-height

  # --- 기계 롤러 (machine-servicing) --------------------------------------
  # 맨 '롤러'는 타이어롤러(차량계 건설기계)와 기계 롤러를 구분하지 못한다.
  # 기계 쪽 표현만 골라 잇는다.
  - surface: [롤러기, 기계 롤러, 구동롤러, 압연롤러]
    keywords: [롤러기]
    category: machinery

  # 기계 롤러는 후진하지 않는다. '후진'이 붙은 롤러는 도로 다짐용(차량계
  # 건설기계)이므로, 맨 '롤러'를 열지 않고도 이 표현만 안전하게 이을 수 있다.
  - surface: [후진하는 롤러, 후진 중인 롤러, 후진중인 롤러]
    keywords: [타이어롤러]
    category: machinery

  # --- 화물자동차 계열 (cargo-vehicle-work) -------------------------------
  # 쓰레기 수거차는 특수용도 화물자동차로, 제20조제7호의 '화물자동차 등'에
  # 해당한다. 사고속보는 '수거차량'·'청소차'로 적는다.
  - surface: [수거차량, 수거 차량, 쓰레기 수거차, 청소차량]
    keywords: [화물자동차]
    category: transport

  # --- 임업 (logging-work) ------------------------------------------------
  - surface: [벌목, 벌도목, 벌목현장, 벌채, 간벌]
    keywords: [벌목]
    category: forestry
    note: 사고속보 표현은 "벌목 작업 중 넘어지는 벌도목에 맞음"이 전형

  # --- 추락 단부 ----------------------------------------------------------
  - surface: [단부, 슬래브 단부, 개구부]
    keywords: [단부]
    category: work-at-height

  # 제42조는 "추락할 위험이 있는 장소"를 특정하지 않는다. 사고속보에 반복적으로
  # 나오는 장소 표현을 추락 위험 작업 신호로 잇는다.
  - surface: [옥상, 발코니, 베란다, 난간, 옹벽]
    keywords: [추락]
    category: work-at-height

  # 밟고 있던 면이 무너져 떨어지는 사고가 반복된다 — 천장 마감재, 바닥 마감재.
  # 제45조는 '지붕'에 한정되므로 이들은 제42조(작업발판·추락방호망·안전대)
  # 영역이다. 수집분의 '마감재' 4건은 전부 떨어짐 사고다.
  #
  # 같은 군집의 '천막'·'밟'·'판넬'은 넣지 않았다. 측정 결과:
  #   천막 → +1건이지만 '고소작업대와 상부 구조물 사이에 끼임'이
  #          aerial-work-platform(제186조)에서 work-at-height 로 뒤집혔다
  #   밟   → 24건 중 22건이 이미 roof-work 로 바르게 가 있다. 뒤집을 것이 많다
  #   판넬 → 11건이 6개 매핑에 흩어져 있다
  # 커버리지 1건을 얻고 맞던 매핑을 잃는 교환은 하지 않는다.
  - surface: [마감재, 천장 마감재, 천장마감재]
    keywords: [추락]
    category: work-at-height

  # --- 합성어 억제 -------------------------------------------------------
  # 한국어 합성어가 짧은 키워드를 삼킨다. 해당 키워드가 오직 이 합성어 안에서만
  # 나타날 때에 한해 신호에서 제외한다 (본문에 진짜 용접 작업이 함께 언급되면 유지).
  - surface: [가용접]
    suppress: [용접]
    note: "'철판에 가용접된 러그가 파단' — 인양 사고인데 밀폐공간 용접으로 오탐"

  - surface: [달비계, 달대비계]
    suppress: [비계]
    note: "'달비계 로프가 파단' — 비계가 달비계 안에만 있으면 비계 조립작업이 아니다"

  - surface: [용접부]
    suppress: [용접]
    note: "'달기체인 용접부가 끊어져' — 용접 작업이 아니라 용접부가 파단된 사고다"

# 단독으로는 신호가 되지 않는 범용어.
# 근거: 최근 300건 분석에서 '제거'→석면해체, '설치'→타워크레인 등 오탐 유발 (기획서 §4.3)
stopwords:
  - 제거
  - 설치
  # '해체'를 stopword 에서 빼는 실험을 했다(2026-10-08). 소유권이 정리돼
  # 안전해졌다고 봤지만, 커버리지는 +1건인데 top-1 오탐이 3건 생겼다:
  #   소화약제 용기 밸브 해체 중 폭발 → 구축물 해체작업
  #   거푸집 해체 중 흙덩이에 깔림   → 거푸집·동바리 대신 해체작업
  #   추락방지망 해체 중 떨어짐      → 철골작업 대신 해체작업
  # 일반 동작어가 구체 작업어와 동점이 되면 알파벳순이 가른다. 되돌린다.
  - 해체
  - 조립
  - 운반
  - 작업
  - 점검
  - 정비
  - 전기
  - 화물
  - 사고
  - 재해
  - 교체
  - 보수
