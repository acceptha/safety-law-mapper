# 사고속보 원문 표현 → 매핑 키워드 사전 (사람이 관리, 자동 학습 없음)
#
# 목적: KOSHA 사고속보의 실제 표현을 data/mappings/*.yaml 의 work_type.keywords
#       어휘로 옮긴다. 여기 없는 표현은 매핑 키워드와 직접 일치할 때만 신호가 된다.
#
# 기여 방법: surface 에 원문 표현을, keywords 에 기존 매핑 키워드를 적는다.
#            법령 조문 검증이 필요 없으므로 첫 기여로 적합하다.
#            새 작업 유형 자체가 없다면 이 파일이 아니라 매핑 YAML을 만들어야 한다.

terms:
  # --- 띄어쓰기·표기 변형 -------------------------------------------------
  - surface: [연삭 숫돌, 연삭숫돌, 숫돌]
    keywords: [연삭기]
    note: 사고속보는 "깨진 연삭 숫돌"처럼 띄어 쓰는 경우가 많음

  - surface: [굴삭기]
    keywords: [굴착기]
    note: 법령 용어는 굴착기, 현장 표현은 굴삭기

  - surface: [이동식 비계, 이동식비계, 강관 비계]
    keywords: [비계]

  - surface: [이동식 사다리, 이동식사다리]
    keywords: [사다리]

  - surface: [차량탑재형 고소작업대, 고소작업차, 스카이차]
    keywords: [고소작업대]

  - surface: [천장크레인, 천장 크레인, 이동식 크레인]
    keywords: [크레인]

  - surface: [권상기, 권양기]
    keywords: [호이스트]

  - surface: [화물용 승강기, 화물용승강기, 승강기]
    keywords: [리프트]

  # --- 밀폐공간 (기준규칙 별표18 제11호 명시 장소) ------------------------
  - surface: [정화조, 침전조, 집수조, 오수조, 분뇨]
    keywords: [밀폐공간]
    category: confined-space
    note: 별표18 제11호 — 분뇨·오수 등이 들어있는 정화조·침전조·집수조

  # --- 지붕 (roof-work) ---------------------------------------------------
  - surface: [지붕, 지붕재, 지붕해체, 스카이라이트, 선라이트]
    keywords: [지붕]
    category: work-at-height

  - surface: [채광창]
    keywords: [채광창]
    category: work-at-height

  - surface: [슬레이트]
    keywords: [슬레이트]
    category: work-at-height

  # --- 임업 (logging-work) ------------------------------------------------
  - surface: [벌목, 벌도목, 벌목현장, 벌채, 간벌]
    keywords: [벌목]
    category: forestry
    note: 사고속보 표현은 "벌목 작업 중 넘어지는 벌도목에 맞음"이 전형

  # --- 추락 단부 ----------------------------------------------------------
  - surface: [단부, 슬래브 단부, 개구부]
    keywords: [단부]
    category: work-at-height

  # --- 합성어 억제 -------------------------------------------------------
  # 한국어 합성어가 짧은 키워드를 삼킨다. 해당 키워드가 오직 이 합성어 안에서만
  # 나타날 때에 한해 신호에서 제외한다 (본문에 진짜 용접 작업이 함께 언급되면 유지).
  - surface: [가용접]
    suppress: [용접]
    note: "'철판에 가용접된 러그가 파단' — 인양 사고인데 밀폐공간 용접으로 오탐"

# 단독으로는 신호가 되지 않는 범용어.
# 근거: 최근 300건 분석에서 '제거'→석면해체, '설치'→타워크레인 등 오탐 유발 (기획서 §4.3)
stopwords:
  - 제거
  - 설치
  - 해체
  - 조립
  - 운반
  - 작업
  - 점검
  - 정비
  - 전기
  - 화물
  - 사고
  - 재해
  - 교체
  - 보수
