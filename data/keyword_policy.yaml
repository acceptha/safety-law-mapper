# 키워드 공유 정책 — `slm validate` 의 중복 경고 대상에서 제외할 항목
#
# 배경: 매칭 순위는 [카테고리 > 키워드 점수 > 조건 특이도 > mapping_id 알파벳순]이다.
# 여러 매핑이 같은 키워드를 정확일치로 가지면 키워드 점수가 동점이 되고, 뒤의
# tie-break(조건 특이도·알파벳순)가 순위를 정한다. 두 기준 모두 **더 좁은 매핑**을
# 위로 올리는 경향이 있어, 정작 일반적인 답이 아래로 밀린다.
#
# 실제로 다섯 번 발생했다 (docs/사고속보-연계-기획서.md §7.1, §7.7, §7.8):
#   `철거`     → 석면 해체가 구축물 해체를 밀어냄            (알파벳순)
#   `용접`     → 밀폐공간 용접이 용접·용단을 밀어냄          (알파벳순)
#   `추락`     → 고소작업대(제186조)가 고소작업(제42조)을 밀어냄 (알파벳순)
#   `고소작업` → 고소작업대가 고소작업을 밀어냄               (조건 특이도)
#   `해체`     → 타워크레인 설치·해체가 구축물 해체를 밀어냄   (조건 특이도)
#
# 규칙: **일반어는 일반 매핑 하나가 소유한다.** 특정 매핑은 자기를 구별해 주는
# 어휘만 갖는다. 일반어를 빼도 작업명(name_ko) 부분일치로 검색에는 계속 잡히므로
# 재현율은 유지되고 순위만 바로잡힌다.
#
# 공유가 정당한 경우에만 아래에 근거와 함께 등록한다.

shared_keywords:
  - keyword: 협착
    reason: >-
      기계 협착 위험은 컨베이어·산업용 로봇·프레스에 공통이고 이를 대표할 일반
      매핑이 없다. 셋 다 조건 특이도 1로 같아 어느 것이 1위여도 오답이 아니며,
      셋 모두 결과에 포함되는 것이 사용자에게 옳다.

# 일반어와 그 소유 매핑. owner 외의 매핑이 이 단어를 키워드로 가지면 경고한다.
# owner: null 은 어떤 매핑도 맨 단어로 가질 수 없다는 뜻이다.
#
# shared_keywords 는 "한 단어가 여러 매핑에 퍼진" 모양을 본다. generic_terms 는
# 그 반대 모양 — "일반어를 좁은 매핑 하나가 독점한" 경우를 본다. 후자는 공유
# 개수가 1이라 개수 기준으로는 영원히 걸리지 않는다. 실제로 `산소`를
# gas-welding 이 독점해 잠수 익사 2건이 가스용접으로 매칭됐다.
generic_terms:
  - term: 철거
    owner: demolition-work
    reason: 석면 해체가 가져가 구축물 해체를 밀어냈다 (§7.1)

  - term: 해체
    owner: demolition-work
    reason: 타워크레인 설치·해체가 조건 특이도로 1위를 가져갔다 (§7.8)

  - term: 용접
    owner: welding-cutting
    reason: 조합 매핑(밀폐공간 용접)이 단독 용접 질의를 가져갔다 (§7.1)

  - term: 추락
    owner: work-at-height
    reason: 고소작업대(제186조)가 일반 추락(제42조)을 밀어냈다 (§7.7)

  - term: 고소작업
    owner: work-at-height
    reason: 고소작업대가 조건 특이도로 1위를 가져갔다 (§7.8)

  - term: 산소
    owner: null
    reason: >-
      잠수·밀폐공간·가스용접 어디에나 나타나 특정 작업을 가리키지 않는다.
      gas-welding 이 보유하던 중 "산소 부족으로 익사"한 잠수 사고가
      가스용접으로 매칭됐다 (§7.9). 가스용접은 산소용기·산소절단으로 구체화했다.

  - term: 롤러
    owner: null
    reason: >-
      타이어롤러(차량계 건설기계)와 컨베이어 롤러, 롤러기(제123조)가 모두
      '롤러'다. conveyor-operation 이 보유하던 중 "후진하는 타이어롤러에
      부딪힘" 사고가 컨베이어 작업으로 매칭됐다 (§7.12). 기계 쪽 표현은
      렉시콘에서 '롤러기'로 잇는다.

  - term: 차량계 건설기계
    owner: construction-vehicle-work
    reason: >-
      별표6의 상위 분류어다. 굴착기·항타기 등 전용 매핑이 함께 보유하면
      일반 질의에서 특정 기계가 1위를 가져간다 (§7.12).

  - term: 하역
    owner: heavy-material-transport
    reason: >-
      forklift-operation 이 함께 보유해 "폐비닐 하역운반 중 … 깔림"이 중량물
      취급 대신 지게차로 1위를 잡았다 (§7.13).

  - term: 운반
    owner: heavy-material-transport
    reason: 하역과 같은 이유. 중량물 운반·보관 매핑이 일반 운반을 대표한다.

  - term: 화물
    owner: null
    reason: >-
      화물자동차·화물취급·화물적재가 모두 '화물'이다. 어느 한 작업을 가리키지
      않으므로 화물자동차 계열은 cargo-vehicle-work 가 구체어로 잡는다.

  - term: 차량계 하역운반기계
    owner: cargo-vehicle-work
    reason: 별표의 상위 분류어. 지게차 등 하위 기종 매핑이 가져가면 안 된다.

  - term: 구축물
    owner: structure-stability-work
    reason: >-
      제51·52조(구축물등의 안전 유지·안전성 평가)가 일반 의무다. 해체작업
      매핑이 함께 보유하면 "벽체 보수 중 무너지는 벽체에 깔림" 같은
      비(非)해체 붕괴가 해체작업으로 간다 (§7.16).

  - term: 설치
    owner: null
    reason: >-
      만국기·실외기·낙석방지망·안전난간 설치가 모두 '설치'다. 특정 작업을
      가리키지 않는다. tower-crane-assembly 가 보유하던 중 "만국기 설치 준비
      작업 중 떨어짐"이 타워크레인 설치·해체로 매칭됐다 (§4.3, §7.16).
