mapping_id: cargo-vehicle-work
work_type:
  name_ko: 차량계 하역운반기계 작업
  category: transport
  # 지게차·구내운반차는 전용/별도 매핑이 있거나 하위 기종이므로 상위 분류어와
  # 화물자동차 계열 어휘만 둔다. 맨 '화물'·'하역'·'운반'은 일반어라 제외.
  keywords: [차량계 하역운반기계, 화물자동차, 화물차량, 화물트럭, 적재함]
conditions:
  min_employees: null
  max_employees: null
  substances: []
  equipment: []
applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제172조
        article_title: 접촉의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 하역·운반 중인 화물이나 차량계 하역운반기계등에 접촉되어 근로자가 위험해질 우려가 있는 장소에 근로자를 출입시키지 말 것. 다만 작업지휘자 또는 유도자를 배치해 유도하는 경우는 예외이며, 운전자는 그 유도에 따라야 함
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제172조
      - article_ref: 제171조
        article_title: 전도 등의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계등이 넘어지거나 굴러떨어져 근로자에게 위험을 미칠 우려가 있으면 유도자를 배치하고 지반의 부동침하 및 갓길 붕괴를 방지하기 위한 조치
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제171조
      - article_ref: 제173조
        article_title: 화물적재 시의 조치
        obligation_type: general
        obligation_subject: employer
        summary_ko: 하중이 한쪽으로 치우치지 않게 적재하고, 구내운반차·화물자동차는 화물의 붕괴·낙하를 막기 위해 로프를 거는 등 조치하며, 운전자의 시야를 가리지 않도록 적재. 최대적재량 초과 금지
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제173조
      - article_ref: 제176조
        article_title: 수리 등의 작업 시 조치
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계등의 수리 또는 부속장치의 장착·해체 작업 시 작업지휘자를 지정해 작업순서를 결정·지휘하게 하고, 안전지지대 또는 안전블록 등의 사용 상황을 점검하도록 조치
        valid_from: "2019-10-15"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제176조
      - article_ref: 제98조
        article_title: 제한속도의 지정 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계·차량계 건설기계(최대제한속도 시속 10km 이하 제외)를 사용하는 작업은 미리 작업장소의 지형·지반 상태에 적합한 제한속도를 정해 운전자가 준수하도록 할 것. 운전자는 그 제한속도를 초과해 운전해서는 안 됨
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제98조
      - article_ref: 제99조
        article_title: 운전위치 이탈 시의 조치
        obligation_type: general
        obligation_subject: employer
        summary_ko: 운전자가 운전위치를 이탈할 때 포크·버킷·디퍼 등을 가장 낮은 위치나 지면에 내리고, 원동기를 정지시키고 브레이크를 확실히 거는 등 갑작스러운 이동을 방지하는 조치를 하며, 운전석을 떠날 때는 시동키를 분리할 것(잠금장치 등으로 타인이 운전하지 못하게 한 경우는 예외)
        valid_from: "2024-06-28"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제99조
      - article_ref: 제187조
        article_title: 승강설비
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 바닥으로부터 짐 윗면까지의 높이가 2미터 이상인 화물자동차에 짐을 싣거나 내리는 작업을 하는 경우, 바닥과 적재함의 짐 윗면 사이를 안전하게 오르내릴 수 있는 설비 설치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제187조
      - article_ref: 제38조
        article_title: 사전조사 및 작업계획서의 작성 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계등을 사용하는 작업 시 작업계획서를 작성하고 계획에 따라 작업 수행
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제38조
      - article_ref: 제175조
        article_title: 주용도 외의 사용 제한
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계등은 화물의 적재·하역 등 주된 용도에만 사용할 것. 다만 근로자가 위험해질 우려가 없는 경우는 예외
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제175조
      - article_ref: 제174조
        article_title: 차량계 하역운반기계등의 이송
        obligation_type: general
        obligation_subject: employer
        summary_ko: 자주 또는 견인으로 화물자동차에 싣거나 내리는 작업에 발판·성토 등을 쓰는 경우 전도·굴러떨어짐을 막기 위해 평탄하고 견고한 장소에서 작업하고, 발판은 충분한 길이·폭·강도를 갖춰 적당한 경사로 견고하게 설치하며, 가설대는 충분한 폭·강도와 적당한 경사를 확보하고, 지정운전자의 성명·연락처를 보기 쉬운 곳에 표시해 지정운전자 외에는 운전하지 않도록 할 것
        valid_from: "2019-10-15"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제174조
      - article_ref: 제177조
        article_title: 싣거나 내리는 작업
        obligation_type: general
        obligation_subject: employer
        summary_ko: 단위화물 무게 100kg 이상인 화물을 싣거나 내리는 작업(로프 걸기·풀기, 덮개 덮기·벗기기 포함)을 할 때 작업지휘자에게 작업순서와 순서별 작업방법을 정해 지휘하게 하고, 기구·공구를 점검해 불량품을 제거하며, 관계 근로자가 아닌 사람의 출입을 금지하고, 로프 풀기·덮개 벗기기는 적재함의 화물이 떨어질 위험이 없음을 확인한 후에 하도록 할 것
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제177조
      - article_ref: 제178조
        article_title: 허용하중 초과 등의 제한
        obligation_type: general
        obligation_subject: employer
        summary_ko: 지게차의 허용하중(구조·재료와 포크·램 등에 적재하는 화물의 중심위치에 따라 실을 수 있는 최대하중)을 초과해 사용하지 말고, 안전한 운행을 위한 유지·관리 등은 제조자가 제공하는 제품설명서의 기준을 준수할 것. 구내운반차·화물자동차는 최대적재량을 초과하지 말 것
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제178조
references:
  - title: KOSHA 하역운반기계 안전작업 자료
    url: https://www.kosha.or.kr/kosha/data/machineryEquipment.do
last_verified: "2026-10-14"
verified_by: acceptha
