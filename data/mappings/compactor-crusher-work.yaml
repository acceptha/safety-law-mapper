mapping_id: compactor-crusher-work
work_type:
  name_ko: 압축·파쇄 설비 작업
  category: machinery
  keywords: [압축기, 압축설비, 파쇄기, 분쇄기, 원심기, 스크류]
conditions:
  min_employees: null
  max_employees: null
  substances: []
  equipment: [compactor, crusher]
applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제92조
        article_title: 정비 등의 작업 시의 운전정지 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 동력으로 작동되는 압축·파쇄 설비의 정비·청소·급유·검사·수리·교체·조정 작업 시 운전 정지. 정지한 경우 다른 사람이 운전하지 못하도록 기동장치에 잠금장치를 하고 열쇠를 별도 관리하거나 표지판 설치. 갑자기 가동될 우려가 있으면 작업지휘자 배치. 내부에 압축된 기체·액체가 있으면 미리 방출
        valid_from: "2024-06-28"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제92조
      - article_ref: 제111조
        article_title: 운전의 정지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 원심기·분쇄기등에서 내용물을 꺼내거나 정비·청소·검사·수리 등의 작업을 하는 경우 그 기계의 운전 정지. 다만 자동 배출 구조이거나 안전한 보조기구 사용·위험 부위 방호조치를 한 경우는 제외
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제111조
      - article_ref: 제87조
        article_title: 원동기·회전축 등의 위험 방지
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 압축·파쇄 설비의 원동기·회전축·기어·풀리·벨트 등 위험을 미칠 우려가 있는 부위에 덮개·울·슬리브·건널다리 등 설치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제87조
      - article_ref: 제88조
        article_title: 기계의 동력차단장치
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 동력으로 작동되는 기계에 스위치·클러치 등 동력차단장치를 조작하기 쉬운 위치에 설치하고, 절단·인발·압축·꼬임 등 작업 시 근로자가 작업위치를 이동하지 않고 조작할 수 있는 위치에 설치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제88조
      - article_ref: 제93조
        article_title: 방호장치의 해체 금지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 설비에 설치한 방호장치를 해체하거나 사용을 정지하지 말 것(방호장치 수리·조정·교체 작업 시는 예외), 해당 작업 완료 후 즉시 정상 기능을 발휘하도록 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제93조
