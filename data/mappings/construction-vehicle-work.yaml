mapping_id: construction-vehicle-work
work_type:
  name_ko: 차량계 건설기계 작업
  category: machinery
  # 굴착기·항타기는 전용 매핑이 있으므로 여기 키워드로 넣지 않는다.
  keywords: [차량계 건설기계, 타이어롤러, 로더, 불도저, 덤프트럭, 모터그레이더, 스크레이퍼, 천공기, 펌프카]
conditions:
  min_employees: null
  max_employees: null
  substances: []
  equipment: []
applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제200조
        article_title: 접촉 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 운전 중인 차량계 건설기계에 접촉되어 근로자가 부딪칠 위험이 있는 장소에 근로자를 출입시키지 말 것. 다만 유도자를 배치해 해당 기계를 유도하는 경우는 예외이며, 운전자는 유도자가 유도하는 대로 따라야 함
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제200조
      - article_ref: 제199조
        article_title: 전도 등의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 건설기계가 넘어지거나 굴러떨어져 근로자가 위험해질 우려가 있으면 유도하는 사람을 배치하고 지반의 부동침하 방지, 갓길의 붕괴 방지, 도로 폭 유지 등 필요한 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제199조
      - article_ref: 제38조
        article_title: 사전조사 및 작업계획서의 작성 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 건설기계를 사용하는 작업 시 지형·지반 상태 등을 사전조사하고 그 결과를 기록·보존하며, 조사 결과를 고려한 작업계획서를 작성해 계획에 따라 작업 수행
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제38조
      - article_ref: 제98조
        article_title: 제한속도의 지정 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계·차량계 건설기계(최대제한속도 시속 10km 이하 제외)를 사용하는 작업은 미리 작업장소의 지형·지반 상태에 적합한 제한속도를 정해 운전자가 준수하도록 할 것. 운전자는 그 제한속도를 초과해 운전해서는 안 됨
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제98조
      - article_ref: 제99조
        article_title: 운전위치 이탈 시의 조치
        obligation_type: general
        obligation_subject: employer
        summary_ko: 운전자가 운전위치를 이탈할 때 포크·버킷·디퍼 등을 가장 낮은 위치나 지면에 내리고, 원동기를 정지시키고 브레이크를 확실히 거는 등 갑작스러운 이동을 방지하는 조치를 하며, 운전석을 떠날 때는 시동키를 분리할 것(잠금장치 등으로 타인이 운전하지 못하게 한 경우는 예외)
        valid_from: "2024-06-28"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제99조
      - article_ref: 제202조
        article_title: 승차석 외의 탑승금지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 건설기계를 사용해 작업하는 경우 승차석이 아닌 위치에 근로자를 탑승시키지 말 것
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제202조
      - article_ref: 제206조
        article_title: 수리 등의 작업 시 조치
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 건설기계의 수리나 부속장치의 장착·제거 작업 시 작업지휘자를 지정해 작업순서를 결정·지휘하게 하고, 안전지지대·안전블록 등의 사용상황을 점검하도록 조치
        valid_from: "2019-10-15"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제206조
references:
  - title: KOSHA 건설기계 안전작업 자료
    url: https://www.kosha.or.kr/kosha/data/construction.do
last_verified: "2026-10-14"
verified_by: acceptha
