        obligation_subject: employer
        summary_ko: 달기구 부착 등 요건을 갖춘 굴착기에 한해 화물 인양작업 허용, 제한사항 준수
        valid_from: "2022-10-18"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제221조의5
