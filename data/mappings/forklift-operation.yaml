mapping_id: forklift-operation
work_type:
  name_ko: 지게차 작업
  category: transport
  # 일반어 '하역'·'운반'은 heavy-material-transport, '화물'은 어느 매핑도
  # 소유하지 않는다 — 지게차를 구별해 주는 어휘만 남긴다.
  keywords: [지게차, 헤드가드, 포크]
conditions:
  min_employees: null
  max_employees: null
  substances: []
  equipment: [forklift]
applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제38조
        article_title: 사전조사 및 작업계획서의 작성 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계 사용 작업 시 사전조사 및 작업계획서 작성, 계획에 따라 작업 수행
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제38조
      - article_ref: 제171조
        article_title: 전도 등의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 기계의 넘어짐·굴러떨어짐 위험 시 유도자 배치, 지반 부동침하·갓길 붕괴 방지 조치
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제171조
      - article_ref: 제172조
        article_title: 접촉의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 하역·운반 중인 화물이나 기계에 접촉 위험이 있는 장소에 근로자 출입 금지
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제172조
      - article_ref: 제179조
        article_title: 전조등 등의 설치
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 전조등·후미등을 갖추지 않은 지게차 사용 금지 (조명 확보 장소 예외)
        valid_from: "2021-01-16"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제179조
      - article_ref: 제180조
        article_title: 헤드가드
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 기준에 적합한 헤드가드를 갖추지 않은 지게차 사용 금지
        valid_from: "2022-10-18"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제180조
      - article_ref: 제181조
        article_title: 백레스트
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 백레스트를 갖추지 않은 지게차 사용 금지 (화물 낙하 위험 없는 경우 예외)
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제181조
      - article_ref: 제183조
        article_title: 좌석 안전띠의 착용 등
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 앉아서 조작하는 지게차 운전 근로자에게 좌석 안전띠 착용 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제183조
      - article_ref: 제175조
        article_title: 주용도 외의 사용 제한
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계등은 화물의 적재·하역 등 주된 용도에만 사용할 것. 다만 근로자가 위험해질 우려가 없는 경우는 예외
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제175조
      - article_ref: 제86조
        article_title: 탑승의 제한
        obligation_type: general
        obligation_subject: employer
        summary_ko: 제7항 — 차량계 하역운반기계(화물자동차는 제외)를 사용해 작업하는 경우 승차석이 아닌 위치에 근로자를 탑승시키지 말 것. 다만 추락 등의 위험을 방지하기 위한 조치를 한 경우는 예외. (이 조의 나머지 항은 크레인·리프트·곤돌라·컨베이어 등 다른 설비를 다룬다)
        valid_from: "2024-06-28"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제86조
      - article_ref: 제99조
        article_title: 운전위치 이탈 시의 조치
        obligation_type: general
        obligation_subject: employer
        summary_ko: 운전자가 운전위치를 이탈할 때 포크·버킷 등을 가장 낮은 위치나 지면에 내리고, 원동기를 정지시키고 브레이크를 확실히 거는 등 갑작스러운 이동을 방지하는 조치를 하며, 운전석을 떠날 때는 시동키를 분리할 것
        valid_from: "2024-06-28"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제99조
      - article_ref: 제178조
        article_title: 허용하중 초과 등의 제한
        obligation_type: general
        obligation_subject: employer
        summary_ko: 지게차의 허용하중(구조·재료와 포크·램 등에 적재하는 화물의 중심위치에 따라 실을 수 있는 최대하중)을 초과해 사용하지 말고, 안전한 운행을 위한 유지·관리 등은 제조자가 제공하는 제품설명서의 기준을 준수할 것. 구내운반차·화물자동차는 최대적재량을 초과하지 말 것
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제178조
      - article_ref: 제182조
        article_title: 팔레트 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 지게차 하역운반작업에 쓰는 팔레트·스키드는 적재 화물의 중량에 따른 충분한 강도를 가지고, 심한 손상·변형 또는 부식이 없는 것을 사용할 것
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제182조
references:
  - title: KOSHA 지게차 재해예방 자료
    url: https://www.kosha.or.kr/kosha/data/machineryEquipment.do
last_verified: "2026-08-27"
verified_by: acceptha
