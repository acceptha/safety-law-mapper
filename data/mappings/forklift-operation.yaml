mapping_id: forklift-operation
work_type:
  name_ko: 지게차 작업
  category: transport
  keywords: [지게차, 하역, 운반, 화물, 헤드가드]
conditions:
  min_employees: null
  max_employees: null
  substances: []
  equipment: [forklift]
applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제38조
        article_title: 사전조사 및 작업계획서의 작성 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 차량계 하역운반기계 사용 작업 시 사전조사 및 작업계획서 작성, 계획에 따라 작업 수행
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제38조
      - article_ref: 제171조
        article_title: 전도 등의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 기계의 넘어짐·굴러떨어짐 위험 시 유도자 배치, 지반 부동침하·갓길 붕괴 방지 조치
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제171조
      - article_ref: 제172조
        article_title: 접촉의 방지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 하역·운반 중인 화물이나 기계에 접촉 위험이 있는 장소에 근로자 출입 금지
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제172조
      - article_ref: 제179조
        article_title: 전조등 등의 설치
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 전조등·후미등을 갖추지 않은 지게차 사용 금지 (조명 확보 장소 예외)
        valid_from: "2021-01-16"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제179조
      - article_ref: 제180조
        article_title: 헤드가드
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 기준에 적합한 헤드가드를 갖추지 않은 지게차 사용 금지
        valid_from: "2022-10-18"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제180조
      - article_ref: 제181조
        article_title: 백레스트
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 백레스트를 갖추지 않은 지게차 사용 금지 (화물 낙하 위험 없는 경우 예외)
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제181조
      - article_ref: 제183조
        article_title: 좌석 안전띠의 착용 등
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 앉아서 조작하는 지게차 운전 근로자에게 좌석 안전띠 착용 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제183조
references:
