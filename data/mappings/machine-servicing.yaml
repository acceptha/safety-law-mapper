mapping_id: machine-servicing
work_type:
  name_ko: 기계 정비·청소 작업
  category: machinery
  # '정비'·'청소'·'점검' 같은 일반 동작어는 넣지 않는다 — 어떤 작업에나
  # 나타나 무관한 사고를 끌어온다. 전용 매핑이 없는 설비·부위 명사로만 잡는다.
  keywords: [성형기, 사출성형기, 교반기, 재단기, 선반, 롤러기, 조관기, 적재기, 가공설비, 구동축, 회전부, 회전체]
conditions:
  min_employees: null
  max_employees: null
  substances: []
  equipment: []
applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제92조
        article_title: 정비 등의 작업 시의 운전정지 등
        obligation_type: general
        obligation_subject: employer
        summary_ko: 동력으로 작동되는 기계의 정비·청소·급유·검사·수리·교체·조정 작업 시 근로자가 위험해질 우려가 있으면 운전 정지. 정지한 경우 다른 사람이 운전하지 못하도록 기동장치에 잠금장치를 하고 열쇠를 별도 관리하거나 표지판 설치. 부적절한 작업방법으로 기계가 갑자기 가동될 우려가 있으면 작업지휘자 배치. 내부에 압축된 기체·액체가 있으면 미리 방출
        valid_from: "2024-06-28"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제92조
      - article_ref: 제87조
        article_title: 원동기·회전축 등의 위험 방지
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 기계의 원동기·회전축·기어·풀리·플라이휠·벨트 등 위험을 미칠 우려가 있는 부위에 덮개·울·슬리브·건널다리 등 설치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제87조
      - article_ref: 제93조
        article_title: 방호장치의 해체 금지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 기계·기구·설비에 설치한 방호장치를 해체하거나 사용을 정지하지 말 것(방호장치의 수리·조정·교체 작업 시는 예외), 해당 작업 완료 후 즉시 정상 기능을 발휘하도록 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제93조
      - article_ref: 제94조
        article_title: 작업모 등의 착용
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 동력으로 작동되는 기계에 근로자의 머리카락 또는 의복이 말려 들어갈 우려가 있는 경우 작업에 알맞은 작업모 또는 작업복을 착용하도록 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제94조
      - article_ref: 제95조
        article_title: 장갑의 사용 금지
        obligation_type: provision
        obligation_subject: employer
        summary_ko: 날·공작물 또는 축이 회전하는 기계를 취급하는 경우 손에 밀착이 잘되는 가죽 장갑 등 손이 말려 들어갈 위험이 없는 장갑을 사용하도록 조치
        valid_from: "2011-07-06"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제95조
references:
