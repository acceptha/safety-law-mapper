applicable_laws:
  - law_id: osh-rule
    articles:
      - article_ref: 제51조
        article_title: 구축물등의 안전 유지
        obligation_type: general
        obligation_subject: employer
        summary_ko: 구축물등이 고정하중·적재하중, 시공·해체 작업 중 발생하는 하중, 적설·풍압·지진이나 진동 및 충격 등으로 전도·폭발하거나 무너지는 위험을 예방하기 위해 설계도면·시방서·구조설계도서·해체계획서 등 설계도서를 준수해 필요한 조치
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제51조
      - article_ref: 제52조
        article_title: 구축물등의 안전성 평가
        obligation_type: inspection
        obligation_subject: employer
        summary_ko: 인근 굴착·항타작업 등으로 침하·균열이 생겨 붕괴가 예상되거나, 지진·부동침하로 균열·비틀림이 발생했거나, 자체 무게·적설·풍압 등으로 붕괴 위험이 있거나, 화재로 내력이 저하됐거나, 장기 미사용 구축물을 재사용하거나, 주요구조부의 설계·시공 방법을 변경하는 경우 등에는 구조검토·안전진단 등 안전성 평가를 실시해 위험성을 미리 제거
        valid_from: "2023-11-14"
        valid_until: null
        source_url: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제52조
references:
