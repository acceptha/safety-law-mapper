<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="'D2Coding','Cascadia Code','JetBrains Mono','Consolas','Noto Sans KR',monospace" font-size="14">
  <defs>
    <clipPath id="win"><rect x="0" y="0" width="780" height="560" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="780" height="560" rx="10" fill="#1e1e2e"/>
    <rect x="0" y="0" width="780" height="36" fill="#181825"/>
    <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
    <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
    <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
    <text x="390" y="23" text-anchor="middle" fill="#a6adc8" font-size="12">safety-law-mapper</text>

    <text x="24" y="66" fill="#a6e3a1">$ <tspan fill="#cdd6f4">pip install safety-law-mapper</tspan></text>
    <text x="24" y="94" fill="#a6e3a1">$ <tspan fill="#cdd6f4">slm search 밀폐공간 용접</tspan></text>

    <text x="24" y="126" fill="#cdd6f4">검색 결과 3건:</text>

    <text x="24" y="158" fill="#89b4fa" font-weight="bold">■ 밀폐공간 용접  [confined-space-welding]</text>
    <text x="40" y="182" fill="#a6adc8">분류: confined-space</text>
    <text x="40" y="204" fill="#a6adc8">검증일: 2026-08-26</text>
    <text x="40" y="228" fill="#f9e2af">── 산업안전보건기준에 관한 규칙</text>
    <text x="56" y="252" fill="#cdd6f4">제619조 (밀폐공간 작업 프로그램의 수립·시행)</text>
    <text x="72" y="274" fill="#6c7086">— 밀폐공간 작업 전 작업 프로그램 수립·시행 (용접 병행 시에도 적용)</text>
    <text x="56" y="298" fill="#cdd6f4">제619조의2 (산소 및 유해가스 농도의 측정 및 기록 등)</text>
    <text x="72" y="320" fill="#6c7086">— 용접 흄·가스 발생 환경에서 산소·유해가스 농도 측정</text>
    <text x="56" y="344" fill="#cdd6f4">제241조 (화재위험작업 시의 준수사항)</text>
    <text x="72" y="366" fill="#6c7086">— 밀폐공간 내 화기작업 시 화재예방 조치</text>
    <text x="56" y="390" fill="#cdd6f4">제241조의2 (화재감시자)</text>
    <text x="72" y="412" fill="#6c7086">— 밀폐공간 용접 작업 시 화재감시자 지정·배치</text>
    <text x="72" y="436" fill="#74c7ec" font-size="12">근거: https://www.law.go.kr/법령/산업안전보건기준에관한규칙/제619조 …</text>

    <text x="24" y="470" fill="#585b70">■ 용접·용단 작업  [welding-cutting]  ·  ■ 밀폐공간 작업  [confined-space-work]  …</text>

    <text x="24" y="508" fill="#f9e2af">⚠️ 본 결과는 참고용이며 법적 판단을 대체하지 않습니다.</text>
    <text x="24" y="540" fill="#a6e3a1">$ <tspan fill="#cdd6f4">▌</tspan></text>
  </g>
