[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safety-law-mapper"
version = "0.2.0"
description = "작업 상황을 입력하면 적용되는 한국 안전 법령·조항을 찾아주는 규칙 기반 매핑 엔진"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "safety-law-mapper contributors" }]
keywords = ["safety", "law", "korea", "occupational-safety", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jsonschema>=4.0",
]

[project.urls]
Repository = "https://github.com/acceptha/safety-law-mapper"

[project.scripts]
slm = "safety_law_mapper.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/safety_law_mapper"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "safety_law_mapper/data"
"schemas" = "safety_law_mapper/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
