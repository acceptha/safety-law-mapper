# Golden query fixtures: regression contract for the matcher.
# Each case: query -> mappings that MUST appear, articles that MUST be included.
- name: confined-space-welding-query
  query:
    keywords: [밀폐공간, 용접]
  must_include_mappings: [confined-space-welding, confined-space-work, welding-cutting]
  top_mapping: confined-space-welding
  must_include_articles:
    - { mapping_id: confined-space-welding, law_id: osh-rule, article_ref: 제619조 }
    - { mapping_id: confined-space-welding, law_id: osh-rule, article_ref: 제241조의2 }
- name: confined-space-only
  query:
    keywords: [밀폐공간]
  must_include_mappings: [confined-space-work]
  must_include_articles:
    - { mapping_id: confined-space-work, law_id: osh-rule, article_ref: 제619조 }
    - { mapping_id: confined-space-work, law_id: osh-rule, article_ref: 제619조의2 }
- name: welding-only
  query:
    keywords: [용접]
  must_include_mappings: [welding-cutting]
  must_include_articles:
    - { mapping_id: welding-cutting, law_id: osh-rule, article_ref: 제241조의2 }
- name: category-query
  query:
    category: confined-space
  must_include_mappings: [confined-space-work, confined-space-welding]
- name: forklift-query
  query:
    keywords: [지게차]
  must_include_mappings: [forklift-operation]
  top_mapping: forklift-operation
  must_include_articles:
    - { mapping_id: forklift-operation, law_id: osh-rule, article_ref: 제180조 }
    - { mapping_id: forklift-operation, law_id: osh-rule, article_ref: 제38조 }
- name: height-query
  query:
    keywords: [추락, 고소작업]
  must_include_mappings: [work-at-height]
  top_mapping: work-at-height
  must_include_articles:
    - { mapping_id: work-at-height, law_id: osh-rule, article_ref: 제42조 }
- name: crane-query
  query:
    keywords: [크레인]
  must_include_mappings: [crane-lifting]
  must_include_articles:
    - { mapping_id: crane-lifting, law_id: osh-rule, article_ref: 제146조 }
- name: excavation-query
  query:
    keywords: [굴착]
  must_include_mappings: [excavation-work]
  must_include_articles:
    - { mapping_id: excavation-work, law_id: osh-rule, article_ref: 제339조 }
